name: Update Supported Versions

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: update-supported-versions-main
  cancel-in-progress: false

jobs:
  update-versions:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout supported-versions.txt from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          filter: 'blob:none'
          sparse-checkout: |
            supported-versions.txt
          sparse-checkout-cone-mode: false

      - name: Update versions, push branch, and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BRANCH="chore/update-versions-${TAG}"
          FILE="supported-versions.txt"

          touch "${FILE}"
          if ! grep -Fxq "${TAG}" "${FILE}"; then
            echo "${TAG}" >> "${FILE}"
          fi
          sort -u -V "${FILE}" -o "${FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add "${FILE}"

          if ! git diff --cached --quiet; then
            git commit -m "chore: update supported-versions.txt with ${TAG} [skip ci]"
            git push -u origin "${BRANCH}" --force

            # Create PR if one does not already exist for this branch
            if ! gh pr view "${BRANCH}" &>/dev/null; then
              gh pr create \
                --base main \
                --head "${BRANCH}" \
                --title "chore: update supported-versions.txt with ${TAG}" \
                --body "Automated PR created on tag push \`${TAG}\` to update \`supported-versions.txt\`."
            fi
          fi
