apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rancher-mcp-server-ingress
  namespace: cattle-ai-agent-system
spec:
  podSelector:
    matchLabels:
      app: rancher-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rancher-ai-agent
