[project]
name = "rancher-ai-agent"
version = "0.1.0"
description = "Rancher AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio==4.0.0",
    "langchain[mcp]==1.4.9",
    "langchain-google-genai==4.4.3",
    "fastapi[standard]==0.162.2",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.7.4",
    "langchain-text-splitters==1.1.3",
    "langchain-community==0.4.2",
    "langfuse==5.1.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "mcp==2.3.0",
    "httpx2==2.12.0",
    "numpy==2.5.4",
    "fastmcp==4.1.7",
    "kubernetes==37.0.1",
    "langchain-aws==1.9.2",
    "psycopg[binary,pool]==3.3.8",
    "kopf==1.45.2",
    "authlib==1.9.5",
]

[dependency-groups]
test = [
    "testcontainers==4.15.0",
    "mock==5.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:HTTPResponse.getheaders\\(\\) is deprecated:DeprecationWarning:kubernetes.client.rest",
]
