<!DOCTYPE html>
<html>
    <head>
        <title>Rancher AI</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 20px; }
            #messages { list-style-type: none; margin: 0; padding: 0; border: 1px solid #ccc; height: 500px; overflow-y: scroll; margin-bottom: 10px; }
            #messages li { padding: 8px 12px; }
            #messages li:nth-child(odd) { background: #f2f2f2; }
            input { padding: 10px; width: 80%; }
            button { padding: 10px; width: 18%; }
        </style>
    </head>
    <body>
        <h1>Rancher AI Chat</h1>
        <ul id='messages'></ul>
        <form action="" onsubmit="sendMessage(event)">
            <input type="text" id="messageText" autocomplete="off"/>
            <button>Send</button>
        </form>
        <script>
            // Establish a WebSocket connection
            const ws = new WebSocket("ws://localhost:8000/v1/ws/messages");
            ws.onopen = function(event) {
                console.log("WebSocket connection established.");
                const li = document.createElement('li');
                li.textContent = "Connected to the server!";
                document.getElementById('messages').appendChild(li);
            };

            let currentMessageLi;

               // Listen for OAuth success from popup window via BroadcastChannel
            const oauthChannel = new BroadcastChannel('oauth_channel');
            oauthChannel.onmessage = function(event) {
                if (event.data.type === 'oauth_success') {
                    const messages = document.getElementById('messages');
                    // Update UI to show authentication completed
                    const successLi = document.createElement('li');
                    successLi.textContent = 'Authentication successful! Token received.';
                    successLi.style.color = '#4caf50';
                    successLi.style.fontStyle = 'italic';
                    messages.appendChild(successLi);
                    messages.scrollTop = messages.scrollHeight;
                    ws.send("authentication_confirmed");
                }
            };

            ws.onmessage = function(event) {
                console.log("msg received."+ event.data);
                const messages = document.getElementById('messages');
                const data = event.data;

                if (data.startsWith("<error>")) {
                    alert(data.substring(7)); // Show alert without the <error> tag
                    return;
                }

                // Handle token refresh: call the HTTP endpoint to persist cookies
                if (data.startsWith("<token-refresh>")) {
                    const jsonStr = data.substring(15, data.indexOf("</token-refresh>"));
                    try {
                        const refreshData = JSON.parse(jsonStr);
                        fetch("/oauth/refresh", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            credentials: "same-origin",
                            body: JSON.stringify({ agent: refreshData.agent })
                        }).then(resp => {
                            if (resp.ok) {
                                console.log("OAuth token cookies refreshed successfully.");
                                ws.send("ok");
                            } else {
                                console.warn("Failed to refresh OAuth token cookies:", resp.status);
                            }
                        }).catch(err => {
                            console.error("Error calling /oauth/refresh:", err);
                        });
                    } catch (e) {
                        console.error("Failed to parse token-refresh data:", e);
                    }
                    return;
                }

                // Handle OAuth2 authentication
                if (data.startsWith("<authentication>")) {
                    const authData = data.substring(16, data.indexOf("</authentication>"));
                    try {
                        const authInfo = JSON.parse(authData);
                        if (authInfo.type === "oauth2" && authInfo.url) {
                            // Open OAuth popup
                            const width = 800;
                            const height = 900;
                            const left = (screen.width - width) / 2;
                            const top = (screen.height - height) / 2;
                            const popup = window.open(
                                authInfo.url,
                                'OAuth2 Authentication',
                                `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
                            );

                            // Display authentication message
                            const authLi = document.createElement('li');
                            authLi.textContent = 'Authentication required. Please complete the OAuth2 flow in the popup window.';
                            authLi.style.color = '#ff9800';
                            authLi.style.fontStyle = 'italic';
                            messages.appendChild(authLi);
                        }
                    } catch (e) {
                        console.error("Failed to parse authentication data:", e);
                    }
                    return;
                }

                if (data === "<message>") {
                    currentMessageLi = document.createElement('li');
                    messages.appendChild(currentMessageLi);
                } else if (data === "</message>") {
                    currentMessageLi = null;
                } else if (currentMessageLi) {
                    currentMessageLi.textContent += data;
                } /*else {
                    // Fallback for messages not wrapped in <message> tags
                    const message = document.createElement('li');
                    const messageText = document.createTextNode(data);
                    message.appendChild(messageText);
                    messages.appendChild(message);
                }*/
                messages.scrollTop = messages.scrollHeight; // Auto-scroll to the bottom
            };


            ws.onclose = function(event) {
                console.log("WebSocket connection closed.");
                const li = document.createElement('li');
                li.textContent = "Connection closed.";
                document.getElementById('messages').appendChild(li);
            };

            ws.onerror = function(error) {
                console.error("WebSocket error: ", error);
            };

            // Function to send a message
            function sendMessage(event) {
                const input = document.getElementById("messageText");
                if (input.value) {
                    ws.send(input.value);
                    
                    // Add the sent message to our own list
                    const messages = document.getElementById('messages');
                    const message = document.createElement('li');
                    message.textContent = `You: ${input.value}`;
                    message.style.fontWeight = "bold";
                    messages.appendChild(message);

                    input.value = '';
                }
                event.preventDefault();
            }
        </script>
    </body>
</html>
