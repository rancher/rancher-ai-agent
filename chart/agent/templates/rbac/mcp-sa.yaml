apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-cert-rotator-sa
  namespace: cattle-ai-agent-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-rancher-settings-role
rules:
- apiGroups: ["management.cattle.io"]
  resources: ["settings"]
  verbs: ["get"]
  resourceNames: ["internal-server-url", "internal-cacerts"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-rancher-settings-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-rancher-settings-role
subjects:
- kind: ServiceAccount
  name: mcp-cert-rotator-sa
  namespace: cattle-ai-agent-system
---
{{- if not .Values.insecureSkipTls }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-rotator-role
  namespace: cattle-ai-agent-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "update", "patch", "delete"]
  resourceNames: ["cattle-mcp-tls", "cattle-mcp-ca"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-mcp-cert-rotator
  namespace: cattle-ai-agent-system
subjects:
- kind: ServiceAccount
  name: mcp-cert-rotator-sa
  namespace: cattle-ai-agent-system
roleRef:
  kind: Role
  name: cert-rotator-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}