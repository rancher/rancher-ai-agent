---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: aitasks.ai.cattle.io
spec:
  group: ai.cattle.io
  names:
    categories:
    - ai
    kind: AITask
    listKind: AITaskList
    plural: aitasks
    shortNames:
    - ait
    singular: aitask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.taskDefinitionRef
      name: Definition
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.result
      name: Result
      type: string
    - jsonPath: .status.pendingValidation
      name: Validation
      type: boolean
    - jsonPath: .status.startTime
      name: Started
      priority: 1
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'AITask is the Schema for the aitasks API: one execution of an
          AITaskDefinition.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AITaskSpec defines a single execution of an AITaskDefinition.
            properties:
              agents:
                description: Agents lists the AIAgentConfig names this task may use.
                  Empty means every enabled agent.
                items:
                  maxLength: 253
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              prompt:
                description: Prompt is the plain-language description of what Liz
                  must do.
                maxLength: 8192
                minLength: 1
                type: string
              taskDefinitionRef:
                description: TaskDefinitionRef is the name of the AITaskDefinition
                  (same namespace) this task executes.
                maxLength: 52
                minLength: 1
                type: string
            required:
            - prompt
            - taskDefinitionRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: AITaskStatus defines the observed state of AITask.
            properties:
              completionTime:
                format: date-time
                type: string
              pendingValidation:
                description: |-
                  PendingValidation is true while the run is paused (phase Running) waiting for a user to
                  answer a human validation request, in the follow-up chat or with the
                  ai.cattle.io/validation-response annotation.
                type: boolean
              phase:
                description: TaskPhase is the lifecycle phase of an AITask.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              result:
                description: Result is the overall health verdict of the task.
                enum:
                - Healthy
                - Warning
                - Critical
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
