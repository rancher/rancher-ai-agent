[project]
name = "rancher-ai-agent"
version = "0.1.0"
description = "Rancher AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio==4.0.0",
    "langchain==1.3.13",
    "langchain-google-genai==4.2.7",
    "fastapi[standard]==0.137.2",
    "langchain-mcp-adapters==0.3.0",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.3.5",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "langfuse==4.14.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.0",
    "mcp==1.28.1",
    "fastmcp==3.4.4",
    "numpy==2.5.0",
    "kubernetes==36.0.2",
    "langchain-aws==1.6.2",
    "psycopg[binary,pool]==3.3.4",
    "kopf==1.44.6",
    "authlib==1.7.2",
    "boto3==1.43.46",
]

[dependency-groups]
test = [
    "testcontainers==4.14.2",
    "mock==5.2.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:HTTPResponse.getheaders\\(\\) is deprecated:DeprecationWarning:kubernetes.client.rest",
]
